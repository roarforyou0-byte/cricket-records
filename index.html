<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cricket Records Hub</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f4f4;
padding:15px;
}

.card{
background:white;
padding:15px;
margin-bottom:15px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

input{
padding:10px;
width:60%;
}

button{
padding:10px;
margin:4px;
border:none;
border-radius:8px;
background:#2196f3;
color:white;
}

.player{
padding:12px;
border-bottom:1px solid #ddd;
}

.scoreBtns button{
min-width:45px;
}
</style>
</head>

<body>

<div class="card">
<h1>🏏 Cricket Records Hub</h1>
<p><b>Respect the game. Trust the team. Own the moment.</b></p>
<p><b>Captains:</b> Manish & Aryan Nain</p>
</div>

<div class="card">
<h2>Add Player</h2>

<input id="playerName" placeholder="Player Name">

<button onclick="addPlayer()">Add</button>
</div>

<div class="card">
<h2>Players</h2>
<div id="players"></div>
</div>

<script>

let players =
JSON.parse(localStorage.getItem("players")) || [];

function save(){
localStorage.setItem(
"players",
JSON.stringify(players)
);
}

function render(){

let html="";

players.forEach((p,i)=>{

if(!p.runs) p.runs=0;
if(!p.balls) p.balls=0;
if(!p.wickets) p.wickets=0;

let sr=0;

if(p.balls>0){
sr=((p.runs/p.balls)*100).toFixed(2);
}

html+=`
<div class="player">

<b>${p.name}</b><br><br>

Runs: ${p.runs}
|
Balls: ${p.balls}
|
SR: ${sr}
|
Wickets: ${p.wickets}

<br><br>

<div class="scoreBtns">

<button onclick="score(${i},0)">0</button>

<button onclick="score(${i},1)">1</button>

<button onclick="score(${i},2)">2</button>

<button onclick="score(${i},3)">3</button>

<button onclick="score(${i},4)">4</button>

<button onclick="score(${i},6)">6</button>

<button onclick="wicket(${i})">W</button>

<button onclick="removePlayer(${i})">
Delete
</button>

</div>

</div>
`;
});

document.getElementById("players").innerHTML=html;
}

function addPlayer(){

let name =
document.getElementById("playerName")
.value.trim();

if(!name) return;

players.push({
name:name,
runs:0,
balls:0,
wickets:0
});

save();
render();

document.getElementById("playerName")
.value="";
}

function score(i,runs){

players[i].runs += runs;
players[i].balls++;

save();
render();
}

function wicket(i){

players[i].balls++;
players[i].wickets++;

save();
render();
}

function removePlayer(i){

players.splice(i,1);

save();
render();
}

render();

</script>

</body>
</html>
