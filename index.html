<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cricket Records Hub</title>

<style>
body{
font-family:Arial;
background:#f4f4f4;
padding:15px;
}

.card{
background:white;
padding:15px;
margin-bottom:15px;
border-radius:10px;
box-shadow:0 2px 5px rgba(0,0,0,.1);
}

input,button{
padding:10px;
margin:5px;
}

button{
background:#2196f3;
color:white;
border:none;
border-radius:6px;
}

.player{
padding:8px;
border-bottom:1px solid #ddd;
}
</style>
</head>

<body>

<div class="card">
<h1>🏏 Cricket Records Hub</h1>
<p><b>Respect the game. Trust the team. Own the moment.</b></p>
<p>Captains: Manish & Aryan Nain</p>
</div>

<div class="card">
<h2>Add Player</h2>

<input id="playerName" placeholder="Player Name">

<button onclick="addPlayer()">
Add
</button>
</div>

<div class="card">
<h2>Players</h2>

<div id="players"></div>
</div>

<script>

let players=
JSON.parse(localStorage.getItem("players"))
||[
{name:"Manish",runs:0,balls:0},
{name:"Manish Nain",runs:0,balls:0},
{name:"Deepak Kumar Nain",runs:0,balls:0},
{name:"Aryan Kumar Nain",runs:0,balls:0},
{name:"Kapil Nain",runs:0,balls:0},
{name:"Badal",runs:0,balls:0},
{name:"Monty",runs:0,balls:0},
{name:"Sagar Chaudhary",runs:0,balls:0}
];

function save(){
localStorage.setItem(
"players",
JSON.stringify(players)
);
}

function render(){

let html="";

players.forEach((p,i)=>{

let sr=0;

if(p.balls>0){
sr=((p.runs/p.balls)*100).toFixed(2);
}

html+=`
<div class="player">

<b>${p.name}</b><br>

Runs: ${p.runs}
|
Balls: ${p.balls}
|
SR: ${sr}

<br><br>

<button onclick="addRun(${i})">
+1 Run
</button>

<button onclick="addBall(${i})">
+1 Ball
</button>

<button onclick="removePlayer(${i})">
Delete
</button>

</div>
`;
});

document.getElementById("players")
.innerHTML=html;
}

function addPlayer(){

let name=
document.getElementById("playerName")
.value.trim();

if(!name)return;

players.push({
name:name,
runs:0,
balls:0
});

save();
render();

document.getElementById("playerName")
.value="";
}

function addRun(i){
players[i].runs++;
save();
render();
}

function addBall(i){
players[i].balls++;
save();
render();
}

function removePlayer(i){
players.splice(i,1);
save();
render();
}

render();

</script>

</body>
</html>
